name: One-time cleanup of obsolete branches

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-obsolete-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete experiment and backup branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          obsolete_branches=(
            "backup-main-before-custom-buttons-20261022"
            "backup-main-before-figma-button-icons-20261022"
            "backup-main-before-figma-layout-20261022"
            "backup-main-before-figma-style-20261022"
            "backup-main-before-gtk-restore-20261023"
            "backup-main-before-responsive-resize-20261023"
            "backup-main-before-slint-again-20261023"
            "feat/slint-player-integration"
            "feature/figma-web-ui"
            "figma-style-transfer"
            "fix/slint-player-layout-resizing"
            "fix-responsive-resize-crisp-icons-20261023"
            "fix-slint-export-1280x720"
            "restore-gtk-relm4-20261023"
            "slint-figma-window-resize-20261023"
            "ui-redesign-slint"
            "cleanup-unused-legacy-files-20261023"
          )

          mapfile -t existing_branches < <(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name')
          failed=0

          for branch_name in "${obsolete_branches[@]}"; do
            if ! printf '%s\n' "${existing_branches[@]}" | grep -Fxq -- "${branch_name}"; then
              echo "Already absent: ${branch_name}"
              continue
            fi

            if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch_name}" >/dev/null; then
              echo "Deleted: ${branch_name}"
            else
              echo "FAILED: ${branch_name}" >&2
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "One or more branches could not be deleted; leaving this workflow so the job can be retried." >&2
            exit 1
          fi

          sha="$(gh api "repos/${GH_REPO}/contents/.github/workflows/cleanup-obsolete-branches.yml?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GH_REPO}/contents/.github/workflows/cleanup-obsolete-branches.yml" \
            -f message="Remove one-time branch cleanup workflow" \
            -f sha="${sha}" \
            -f branch=main
